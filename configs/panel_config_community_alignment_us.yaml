# Community Alignment US panel.
# Source family matches the paper:
# - ACS/Census-style targets for age, gender, education, ethnicity
# - Pew-style national ideology split for politics
tolerance: 0.1
panel_size: 145
locale_filter: "us"
attributes:
  - name: age
    column: age
    nested_key: null
    population_proportions:
      "18-34": 0.29
      "35-45": 0.17
      "46-54": 0.16
      "55+": 0.38
  - name: gender
    column: gender
    nested_key: null
    slack_categories:
      - Other
      - "Prefer not to say"
    population_proportions:
      Female: 0.51
      Male: 0.48
      Other: 0.005
      "Prefer not to say": 0.005
  - name: education
    column: education
    nested_key: null
    slack_categories:
      - Other
      - "Prefer not to say"
    population_proportions:
      "(At most) Complete Secondary": 0.36
      "Some post-secondary": 0.25
      "Post-secondary graduate": 0.23
      "Some or complete graduate degree": 0.15
      Other: 0.005
      "Prefer not to say": 0.005
  - name: ethnicity
    column: ethnicity
    nested_key: null
    slack_categories:
      - Other
      - "Prefer not to say"
    population_proportions:
      White: 0.60
      "Black or African American": 0.12
      "Hispanic or Latino": 0.18
      Asian: 0.06
      Other: 0.02
      "Prefer not to say": 0.02
  - name: political
    column: political
    nested_key: null
    slack_categories:
      - "Prefer not to say"
    population_proportions:
      Liberal: 0.24
      Moderate: 0.38
      Conservative: 0.33
      "No identification": 0.04
      "Prefer not to say": 0.01
