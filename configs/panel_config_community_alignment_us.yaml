# Community Alignment US panel.
# This mirrors the Community Alignment paper's published balanced US subset:
# constrain only age, gender, and ethnicity, and use the paper-implied
# target proportions from Tables 7-9.
tolerance: 0.1
panel_size: 350
locale_filter: "us"
attributes:
  - name: age
    column: age
    nested_key: null
    population_proportions:
      "18-34": 0.446
      "35-45": 0.251
      "46-54": 0.126
      "55+": 0.177
  - name: gender
    column: gender
    nested_key: null
    slack_categories:
      - Other
      - "Prefer not to say"
    population_proportions:
      Male: 0.514
      Female: 0.477
      Other: 0.009
      "Prefer not to say": 0.0
  - name: ethnicity
    column: ethnicity
    nested_key: null
    slack_categories:
      - Other
      - "Prefer not to say"
    population_proportions:
      White: 0.520
      "Black or African American": 0.149
      Asian: 0.100
      "Hispanic or Latino": 0.094
      Other: 0.037
      "Prefer not to say": 0.100
